name: Test Build

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        platform: [macos-latest, windows-latest]

    runs-on: ${{ matrix.platform }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: './package-lock.json'

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Install dependencies (Ubuntu only)
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.0-dev libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libheif-dev

      - name: Install libheif (macOS)
        if: matrix.platform == 'macos-latest'
        run: |
          brew install libheif pkg-config
          BREW_PREFIX=$(brew --prefix)
          echo "PKG_CONFIG_PATH=$BREW_PREFIX/lib/pkgconfig:$BREW_PREFIX/opt/libheif/lib/pkgconfig" >> $GITHUB_ENV

      - name: Install libheif (Windows)
        if: matrix.platform == 'windows-latest'
        shell: bash
        run: |
          # Match the release workflow: static .lib + dynamic CRT for a
          # self-contained .exe. Setting both env vars so vcpkg-rs and
          # vcpkg's CLI agree on the triplet to look in.
          vcpkg install libheif:x64-windows-static-md
          echo "VCPKGRS_TRIPLET=x64-windows-static-md" >> $GITHUB_ENV
          echo "VCPKG_DEFAULT_TRIPLET=x64-windows-static-md" >> $GITHUB_ENV
          echo "VCPKG_ROOT=$VCPKG_INSTALLATION_ROOT" >> $GITHUB_ENV

      - name: Install frontend dependencies
        run: npm ci

      - name: Check TypeScript
        run: npm run check

      # Lint step disabled - only errors in unused shadcn-svelte components
      # - name: Lint
      #   run: npm run lint

      - name: Build frontend
        run: npm run build

      - name: Check Rust code
        run: cargo check --manifest-path=./src-tauri/Cargo.toml

      - name: Test Rust code (HEIC pipeline + others)
        run: cargo test --lib --manifest-path=./src-tauri/Cargo.toml

      # Uncomment to run frontend tests
      # - name: Run unit tests
      #   run: npm run test:unit -- --run

      - name: Build Tauri app (test)
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          args: --debug # Build in debug mode for faster testing

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: app-${{ matrix.platform }}-debug
          path: |
            src-tauri/target/debug/bundle/
          retention-days: 7
